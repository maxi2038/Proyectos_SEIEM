{% extends 'base.html' %}
{% load static %}

{% block title %}Mapa de Escuelas SEIEM{% endblock %}

{% block extra_css %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    /* Mobile adjustments */
    @media (max-width: 768px) {
        .map-wrapper {
            flex-direction: column;
        }

        .map-sidebar {
            width: 100%;
            height: auto;
            max-height: 40%;
        }

        .map-content {
            height: 60%;
        }
    }

    .instalada {
        color: #28a745;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<div class="map-wrapper">
    <!-- Sidebar de Filtros -->
    <aside class="map-sidebar">
        <h3 style="border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-top: 0;">Filtros</h3>

        <form method="get" id="filterForm">
            <div class="filter-group checkbox-group" style="display: flex; flex-direction: column; gap: 8px;">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">Colecciones:</label>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" name="coleccion" value="unete" {% if 'unete' in colecciones %}checked{%
                            endif %}>
                        UNETE <span
                            style="width:12px; height:12px; background:#007bff; display:inline-block; border-radius:50%;"></span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" name="coleccion" value="cfe" {% if 'cfe' in colecciones %}checked{% endif
                            %}>
                        CFE <span
                            style="width:12px; height:12px; background:#28a745; display:inline-block; border-radius:50%;"></span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" name="coleccion" value="estatales" {% if 'estatales' in colecciones
                            %}checked{% endif %}>
                        ESCUELAS <span
                            style="width:12px; height:12px; background:#8B4513; display:inline-block; border-radius:50%;"></span>
                    </label>
                </div>
            </div>

            <div class="filter-group">
                <label>Municipio:</label>
                <select name="municipio">
                    <option value="">-- Todos --</option>
                    {% for item in municipios %}
                    <option value="{{ item.nombre }}" {% if item.selected %}selected{% endif %}>{{ item.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="filter-group">
                <label>Zona Escolar:</label>
                <select name="zona_escolar">
                    <option value="">-- Todas --</option>
                    {% for item in zonas %}
                    <option value="{{ item.nombre }}" {% if item.selected %}selected{% endif %}>{{ item.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="filter-group">
                <label>Nivel Educativo:</label>
                <select name="nivel_educativo">
                    <option value="">-- Todos --</option>
                    {% for item in niveles %}
                    <option value="{{ item.nombre }}" {% if item.selected %}selected{% endif %}>{{ item.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="filter-group">
                <label>Buscar (CCT o Nombre):</label>
                <input type="text" name="buscar" value="{{ buscar }}" placeholder="Ej. 15DPR...">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn" style="flex:1;">Filtrar</button>
                <button type="button" onclick="limpiarFiltros()" class="btn btn-secondary"
                    style="flex:1;">Limpiar</button>
            </div>
        </form>
    </aside>

    <!-- Área del Mapa -->
    <div class="map-content">
        <div id="map"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    function limpiarFiltros() {
        window.location.href = "{% url 'ver_mapa' %}";
    }

    // Centered on Estado de México with appropriate zoom and bounds
    var map = L.map('map', {
        minZoom: 8,
        maxBounds: [
            [18.3, -100.8], // Southwest
            [20.5, -98.3]   // Northeast
        ],
        maxBoundsViscosity: 1.0
    }).setView([19.35, -99.6], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Leyenda
    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'leaflet-legend');
        div.innerHTML += `<div><span class="color-box" style="background:#007bff"></span> UNETE</div>`;
        div.innerHTML += `<div><span class="color-box" style="background:#28a745"></span> CFE</div>`;
        div.innerHTML += `<div><span class="color-box" style="background:#8B4513"></span> ESCUELAS</div>`;
        return div;
    };
    legend.addTo(map);

    // Iconos
    var createIcon = (color) => L.divIcon({
        className: "custom-marker",
        html: `<svg width="25" height="41" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5C0 23.44 12.5 41 12.5 41C12.5 41 25 23.44 25 12.5C25 5.6 19.4 0 12.5 0Z" fill="${color}"/><circle cx="12.5" cy="12.5" r="6.5" fill="white"/></svg>`,
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
    });

    var iconUnete = createIcon('#007bff');
    var iconCfe = createIcon('#28a745');
    var iconEstatales = createIcon('#8B4513');

    // Datos
    var datos = {{ datos_json| safe }};
    var total_instaladas = {{ total_instaladas }};

    // Render markers
    var markersLayer = L.layerGroup().addTo(map);

    datos.forEach(function (item) {
        if (!item.LATITUD || !item.LONGITUD) return;

        var coleccion = item.COLECCION ? item.COLECCION.toLowerCase() : '';
        var iconoUsar, clasePopup;
        var programaNombre = coleccion.toUpperCase();

        if (coleccion === 'unete') {
            iconoUsar = iconUnete;
            clasePopup = 'popup-unete';
        } else if (coleccion === 'cfe') {
            iconoUsar = iconCfe;
            clasePopup = 'popup-cfe';
        } else {
            iconoUsar = iconEstatales;
            clasePopup = 'popup-estatales';
        }

        // Construir contenido popup
        let contenido_popup = "";
        let urlMaps = item.LINK && item.LINK.startsWith('http') ? item.LINK : `https://www.google.com/maps?q=${item.LATITUD},${item.LONGITUD}`;
        let nombre = item.NOMBRE_CT || item['NOMBRE DEL CT'] || 'Sin Nombre';

        if (coleccion === 'cfe') {
            let registro = item['INTERNET PARA TODOS CFE 4G (CPE)'] || 'No Reg.';
            if (registro.toUpperCase() === 'INSTALADA') registro = '<span class="instalada">INSTALADA</span>';

            contenido_popup = `
                <b>${nombre}</b><br>
                <small>${programaNombre}</small><hr style="margin:5px 0;">
                <b>CCT:</b> ${item.CCT || '-'}<br>
                <b>Domicilio:</b> ${item.DOMICILIO || '-'}<br>
                <b>Estado:</b> ${registro}<br>
                <b>Coordenadas:</b> ${item.LATITUD}, ${item.LONGITUD}<br>
                <div style="text-align:center; margin-top:5px;">
                    <a href="${urlMaps}" target="_blank" class="btn btn-secondary" style="padding:2px 8px; font-size:12px;">Ver Mapa</a>
                </div>
            `;
        } else {
            contenido_popup = `
                <b>${nombre}</b><br>
                <small>${programaNombre}</small><hr style="margin:5px 0;">
                <b>CCT:</b> ${item.CCT || '-'}<br>
                <b>Municipio:</b> ${item.MUNICIPIO || '-'}<br>
                <b>Zona Escolar:</b> ${item['ZONA ESCOLAR'] || '-'}<br>
                <b>Nivel:</b> ${item['NIVEL EDUCATIVO'] || '-'}<br>
                <b>Turno:</b> ${item.TURNO || '-'}<br>
                <div style="text-align:center; margin-top:5px;">
                    <a href="${urlMaps}" target="_blank" class="btn btn-secondary" style="padding:2px 8px; font-size:12px;">Ver Mapa</a>
                </div>
            `;
        }

        var marker = L.marker([item.LATITUD, item.LONGITUD], { icon: iconoUsar });
        marker.bindPopup(contenido_popup);
        marker.on('popupopen', function (e) {
            if (e.popup._container) e.popup._container.classList.add(clasePopup);
        });
        markersLayer.addLayer(marker);
    });

    // Ajustar vista si hay marcadores
    if (datos.length > 0) {
        var group = new L.featureGroup(markersLayer.getLayers());
        map.fitBounds(group.getBounds());
    }

</script>
{% endblock %}
