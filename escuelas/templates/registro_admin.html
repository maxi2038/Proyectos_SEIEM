<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Registro de Administrador</title>
    <style>
        body {
            background-color: #d0f0c0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .registro-container {
            background-color: #e6ffe6;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,128,0,0.3);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #2e7d32;
            margin-bottom: 25px;
            font-weight: 700;
        }
        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin: 12px 0;
            border: 2px solid #4b8b3b;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        form input[type="text"]:focus,
        form input[type="password"]:focus {
            border-color: #2e7d32;
            outline: none;
        }
        form button {
            background-color: #4b8b3b;
            color: white;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        form button:hover {
            background-color: #3a6d2e;
        }
        .messages p {
            color: #b71c1c;
            font-weight: 600;
            margin: 10px 0 0 0;
        }
    </style>
</head>
<body>
    <div class="registro-container">
        <h2>Registro de Administrador</h2>
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="curp" placeholder="CURP" required autocomplete="off" />
            <input type="text" name="nombre" placeholder="Tu Nombre" required autocomplete="off" />
            <input type="password" name="password" placeholder="Contraseña" required autocomplete="off" />
            <button type="submit">Registrarse</button>
        </form>
    </div>
</body>
</html>
