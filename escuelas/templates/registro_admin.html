<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #3D1522 0%, #56212F 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .registro-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 400px;
            text-align: center;
        }

        h2 {
            color: var(--gold);
            margin-bottom: 25px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        form input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 16px;
            color: white;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        form input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.5);
        }

        form button {
            margin-top: 20px;
            width: 100%;
        }

        .messages p {
            color: #ff5252;
            font-weight: 600;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="decorative-bg">
        <svg class="shape-1" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"
            style="opacity: 0.04; filter: blur(40px);">
            <circle cx="250" cy="250" r="240" fill="#C3A04F" />
        </svg>
    </div>

    <div class="registro-container">
        <div style="margin-bottom: 20px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Coat_of_arms_of_Mexico_%28state%29.png/200px-Coat_of_arms_of_Mexico_%28state%29.png"
                style="height: 60px;">
        </div>
        <h2>Registro</h2>
        <div class="messages">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="curp" placeholder="CURP" required autocomplete="off" />
            <input type="text" name="nombre" placeholder="Tu Nombre" required autocomplete="off" />
            <input type="password" name="password" placeholder="Contraseña" required autocomplete="off" />
            <button type="submit" class="btn">Registrarse</button>
        </form>
    </div>
</body>

</html>
